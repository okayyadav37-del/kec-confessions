<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>KEC Owner Dashboard</title><link rel="stylesheet" href="style.css"><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js"></script><script defer src="admin.js"></script><style>.admin{max-width:900px;margin:45px auto;padding:0 20px}.admin h1{font-size:42px;text-align:left}.login{max-width:420px;margin:35px auto}.field{width:100%;padding:13px;border:1px solid var(--line);border-radius:8px;margin:7px 0 14px}.entry{border:1px solid var(--line);border-radius:10px;padding:17px;margin:12px 0}.entry p{white-space:pre-wrap}.entry small{color:var(--muted)}.danger{background:#fff0f4;color:#c13e70;border:1px solid #f3c5d5;border-radius:7px;padding:8px 12px;cursor:pointer}.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.hidden{display:none}</style></head><body><header class="topbar"><a class="brand" href="./"><span class="heart">♥</span> KEC <b>Confessions</b></a><nav><a href="./">Public page</a></nav></header><main class="admin"><div id="login" class="login panel"><h2>Owner sign in</h2><p class="privacy">Private dashboard. Sign in with the owner account you created in Supabase Auth.</p><label>Email</label><input class="field" id="email" type="email" autocomplete="username"><label>Password</label><input class="field" id="password" type="password" autocomplete="current-password"><button class="submit" id="signIn">Sign in</button><p class="status" id="loginStatus"></p></div><section id="dashboard" class="hidden"><h1>Inbox <em>♥</em></h1><div class="toolbar"><input class="field" style="max-width:320px" id="search" placeholder="Search confessions..."><button class="chip" id="refresh">Refresh</button><button class="chip" id="signOut">Sign out</button></div><p id="dashStatus" class="status"></p><div id="entries"></div></section></main></body></htm
